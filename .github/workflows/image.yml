name: Build OpenServerless Streamer

on:
  push:
    tags:
    - '[0-9]*'
    branches-ignore:
    - '*'
jobs:
  image:
    name: Build OpenServerless Streamer Image
    runs-on: ubuntu-latest
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup
        run: bash .github/cisetup.sh
      - name: License
        uses: apache/skywalking-eyes@v0.9.0
      - name: Assign TAG from pull request
        if:  ${{ github.event_name == 'pull_request' }}
        run: |
          echo "IMG_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Assign TAG from push
        if:  ${{ github.event_name != 'pull_request' }}
        run: |
          echo "IMG_TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"
      - name: Generate .env
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "$OWNER" = "apache" ]; then
            IMAGE=$(awk -F= '/ARG STREAMER_IMAGE_DEFAULT=/ { print $2 ; exit }' Dockerfile)
          else
            IMAGE="ghcr.io/$OWNER/openserverless-streamer"
          fi
          echo "GITHUB_USER=$OWNER" > .env
          echo "MY_STREAMER_IMAGE=$IMAGE" >> .env
          cat .env
      - name: Unit Test
        run: task test
        continue-on-error: false
      - name: Select registry
        env:
          DOCKERHUB_REGISTRY: ${{ secrets.DOCKERHUB_REGISTRY }}
        run: |
          if [ -n "$DOCKERHUB_REGISTRY" ]; then
            REGISTRY="$DOCKERHUB_REGISTRY"
          elif [ "${{ github.repository_owner }}" = "apache" ]; then
            REGISTRY="docker.io"
          else
            REGISTRY="ghcr.io"
          fi
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USER || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Image
        run: task buildx PUSH=1 STREAMER_TAG=$IMG_TAG